<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo Form</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <!-- 🌐 Switch Language -->
    <div class="text-right">
        <a href="?lang=vi">VI</a> | <a href="?lang=en">EN</a>
    </div>

    <!-- 🧾 Title -->
    <h1 class="text-center" th:text="#{title.add}"></h1>

    <form th:action="@{/add-todo(id=${todo.id})}"
          method="post"
          th:object="${todo}">

        <!-- Content -->
        <div class="form-group">
            <label th:text="#{label.content}"></label>
            <input type="text" class="form-control" th:field="*{content}">
            <p class="text-danger"
               th:if="${#fields.hasErrors('content')}"
               th:errors="*{content}"></p>
        </div>

        <!-- Due Date -->
        <div class="form-group">
            <label th:text="#{label.dueDate}"></label>
            <input type="date" class="form-control" th:field="*{dueDate}">
            <p class="text-danger"
               th:if="${#fields.hasErrors('dueDate')}"
               th:errors="*{dueDate}"></p>
        </div>

        <!-- Status -->
        <div class="form-group">
            <label th:text="#{label.status}"></label>
            <select class="form-control" th:field="*{status}">
                <option value="notDone" th:text="#{status.notDone}"></option>
                <option value="done" th:text="#{status.done}"></option>
            </select>
            <p class="text-danger"
               th:if="${#fields.hasErrors('status')}"
               th:errors="*{status}"></p>
        </div>

        <!-- Priority -->
        <div class="form-group">
            <label th:text="#{label.priority}"></label>
            <select class="form-control" th:field="*{priority}">
                <option value="low" th:text="#{priority.low}"></option>
                <option value="medium" th:text="#{priority.medium}"></option>
                <option value="high" th:text="#{priority.high}"></option>
            </select>
            <p class="text-danger"
               th:if="${#fields.hasErrors('priority')}"
               th:errors="*{priority}"></p>
        </div>

        <!-- Buttons -->
        <div class="mt-3">
            <a th:href="@{/todo}" class="btn btn-secondary"
               th:text="#{button.back}"></a>

            <button type="submit" class="btn btn-primary"
                    th:text="#{button.add}"></button>
        </div>

    </form>

</div>

</body>
</html>
