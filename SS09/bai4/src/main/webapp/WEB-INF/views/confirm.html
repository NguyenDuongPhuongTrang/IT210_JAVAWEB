<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>

<div class="container text-center mt-5">
    <div class="card p-4 shadow">
        <h3 class="mb-4">Xác nhận tạo gian hàng</h3>

        <a th:href="@{/accept(status='accept')}" class="btn btn-success mr-2">
            Xác nhận
        </a>

        <a th:href="@{/accept(status='cancel')}" class="btn btn-danger">
            Huỷ
        </a>
    </div>
</div>

</body>
</html>
