<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin gian hàng</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">Thông tin gian hàng</h3>

        <form th:action="@{/save-shop}" method="post" th:object="${shop}">
            <div class="form-group">
                <label for="shopName">Tên gian hàng</label>
                <input type="text" id="shopName" class="form-control" th:field="*{shopName}">
            </div>

            <div class="form-group">
                <label for="category">Loại gian hàng</label>
                <input type="text" id="category" class="form-control" th:field="*{category}">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Tiếp</button>
        </form>
    </div>
</div>

</body>
</html>
