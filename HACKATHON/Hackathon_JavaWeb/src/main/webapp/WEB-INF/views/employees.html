<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">

    <h2 class="mb-4">Danh sách nhân viên</h2>

    <!-- SEARCH + FILTER -->
    <form method="get" class="form-inline mb-3">
        <input type="text" name="keyword" class="form-control mr-2"
               placeholder="Search">

        <select name="position" class="form-control mr-2">
            <option value="">All Position</option>
            <option>Developer</option>
            <option>Tester</option>
            <option>PM</option>
        </select>

        <button class="btn btn-primary">Search</button>
    </form>

    <a href="/add" class="btn btn-success mb-3">+ Add Member</a>

    <div th:if="${#lists.isEmpty(employees)}" class="alert alert-warning">
        Không có nhân viên nào.
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Họ và tên</th>
            <th>Vị trí</th>
            <th>Lương</th>
            <th>Ảnh</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${employees}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.fullName}"></td>
            <td th:text="${e.position}"></td>
            <td>
                <span th:text="${#numbers.formatDecimal(e.salary, 0, 'POINT', 0, 'POINT') + ' VNĐ'}"></span>
            </td>
            <td>
                <img th:src="@{${e.avatarUrl}}"
                     class="rounded-circle" width="50" height="50"
                     onerror="this.src='/resources/images/avatars/avatar-default.png'">
            </td>
            <td>
                <a th:href="@{'/edit/' + ${e.id}}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{'/delete/' + ${e.id}}"
                   onclick="return confirm('Bạn chắc chắn muốn xóa?')"
                   class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
