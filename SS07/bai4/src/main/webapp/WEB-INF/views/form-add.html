<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm món ăn</title>

    <!-- Bootstrap 4 CDN -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header text-center">
            <h4>Thêm món ăn</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/food/add}" method="post"
                  th:object="${foodDTO}" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">Tên món ăn</label>
                    <input th:field="*{name}" type="text"
                           class="form-control"
                           id="name" placeholder="Nhập tên món ăn">
                </div>
                <div class="form-group">
                    <label for="category">Loại món ăn</label>
                    <select th:field="*{category}"
                            class="form-control"
                            id="category">
                        <option value="Khai vị">Khai vị</option>
                        <option value="Món chính">Món chính</option>
                        <option value="Món kèm">Món kèm</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="price">Giá món ăn</label>
                    <input th:field="*{price}" type="number"
                           class="form-control"
                           id="price" placeholder="Nhập giá">
                </div>
                <div class="form-group">
                    <label for="image">Ảnh món ăn</label>
                    <input th:field="*{image}" type="file"
                           class="form-control-file"
                           id="image">
                </div>
                <button type="submit" class="btn btn-success btn-block">
                    Thêm món ăn
                </button>

            </form>
        </div>
    </div>
</div>

</body>
</html>
