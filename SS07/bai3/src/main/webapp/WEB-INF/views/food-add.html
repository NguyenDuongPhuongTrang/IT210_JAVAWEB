<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header text-center">
            <h4>Thêm món ăn</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/foods/add}" method="post"
                  th:object="${foodDTO}" enctype="multipart/form-data">

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Tên món ăn</label>
                    <input th:field="*{name}" type="text"
                           class="form-control"
                           id="name" placeholder="Nhập tên món ăn">
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">Loại món ăn</label>
                    <select th:field="*{category}"
                            class="form-control"
                            id="category">
                        <option value="Khai vị">Khai vị</option>
                        <option value="Món chính">Món chính</option>
                        <option value="Món kèm">Món kèm</option>
                    </select>
                </div>

                <!-- Price -->
                <div class="form-group">
                    <label for="price">Giá món ăn</label>
                    <input th:field="*{price}" type="number"
                           class="form-control"
                           id="price" placeholder="Nhập giá">
                </div>

                <!-- Image -->
                <div class="form-group">
                    <label for="image">Ảnh món ăn</label>
                    <input th:field="*{image}" type="file"
                           class="form-control-file"
                           id="image">
                </div>

                <!-- Button -->
                <button type="submit" class="btn btn-primary btn-block">
                    Thêm món ăn
                </button>
            </form>
        </div>
    </div>

    <!-- Back -->
    <div class="text-center mt-3">
        <a th:href="@{/foods}" class="btn btn-secondary">
            Danh sách món ăn
        </a>
    </div>
</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
